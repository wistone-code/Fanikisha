<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>You're offline — Fanikisha</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
    body{font-family:'Inter',sans-serif;background:#F6F8F9;color:#1B2429;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;}
    .card{background:#fff;border:1px solid #e2e6e9;border-radius:16px;padding:32px 24px;max-width:360px;}
    h1{font-size:20px;margin:0 0 8px;}
    p{color:#5c6b73;font-size:14px;line-height:1.5;margin:0 0 20px;}
    button{background:#1F3A52;color:#fff;border:none;border-radius:9px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;}
</style>
</head>
<body>
    <div class="card">
        <h1>You're offline</h1>
        <p>Fanikisha needs an internet connection to load your event's data. Check your signal and try again.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
