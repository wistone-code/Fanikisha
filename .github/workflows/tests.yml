name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, xml, zip, bcmath, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: php artisan test

  docker-build:
    runs-on: ubuntu-latest
    # Doesn't need the test job to pass first — this just verifies the
    # Dockerfile itself builds successfully, independent of test results.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        # --progress=plain forces BuildKit to print each RUN command's full
        # stdout/stderr into the log. Without it, a failing step (like the
        # composer install below) often only shows a generic "did not
        # complete successfully" summary, with no way to see what composer
        # actually said the problem was.
        run: docker build --progress=plain -t fanikisha-build-check .
